       <main class="workspace">
        <!-- ================= PANEL IZQUIERDO ================= -->
        <div class="panel panel-left">
            <input type="radio" name="repo-tabs" id="repo-web" class="tab-radio" checked>
            <input type="radio" name="repo-tabs" id="repo-desktop" class="tab-radio">
            <input type="radio" name="repo-tabs" id="repo-current" class="tab-radio">

            <div class="tab-header">
                <label for="repo-web" class="tab-label">🌐 Web</label>
                <label for="repo-desktop" class="tab-label">💻 Dsk</label>
                <label for="repo-current" class="tab-label">⚡ Proy</label>
            </div>

            <div class="content-area">
                <div id="content-web" class="tab-content">
                    <div class="pointer-item" onclick="loadPointer('ui_glass.VTHA')">🔗 ui_glass.VTHA</div>
                    <div class="pointer-item" onclick="loadPointer('core_engine.VTHA')">🔗 core_engine.VTHA</div>
                </div>
                <div id="content-desktop" class="tab-content">
                    <div class="pointer-item">🔗 sys_monitor.VTHA</div>
                </div>

        <!-- ================= PANEL CENTRAL ================= -->
        <div class="panel panel-center">
            <input type="radio" name="center-tabs" id="center-editor" class="tab-radio" checked>
            <input type="radio" name="center-tabs" id="center-render" class="tab-radio">

            <div class="tab-header">

            <div class="center-content-area">
                <!-- EDITOR -->
                <div id="view-editor" class="tab-content view-pane">
                    <textarea id="code-editor" class="editor-textarea" onkeyup="updateRender()"><h1 style="color: #ff00d4; text-shadow: 0 0 10px #ff00d4;">ROUSE ROOM - UNIVERSO BDH</h1>
<p style="color: #ffd700;">Entorno activo y funcional.</p></textarea>
                </div>
                <!-- RENDERIZADOR -->
                <div id="view-render" class="tab-content view-pane">

            <div class="panel-section">

                <button class="agent-btn" onclick="openAgent('Agent Alpha - Arquitecto')">Alpha</button>

    </main>

    <!-- ================= VENTANA FRAMELESS (POP-UP) ================= -->
    <div id="agent-popup" class="frameless-popup">
        <div class="popup-header" id="popup-drag-handle">
            <span class="popup-title" id="agent-title">Nombre IA</span>
            <button class="close-btn" onclick="closeAgent()">✖</button>
        </div>
        <div class="popup-body">
            <p class="status-msg">> Interfaz sináptica conectada.</p>
            <div class="prompt-card">
                Esperando directrices, LORD BDH.
            </div>
            <input type="text" class="popup-input" placeholder="Ingresar comando...">
        </div>
    </div>

    <script>
        function updateRender() {
            const code = document.getElementById('code-editor').value;
            const iframe = document.getElementById('render-frame');
            iframe.srcdoc = code;
        }

        function loadPointer(pointerName) {
            const codeArea = document.getElementById('code-editor');
            codeArea.value = `<!-- Puntero Invocado: ${pointerName} -->\n<style>\n  body { background: #080308; color: #ffd700; font-family: sans-serif; padding: 20px; }\n  h2 { color: #ff00d4; text-shadow: 0 0 8px #ff00d4; }\n</style>\n<div>\n  <h2>Puntero ${pointerName} Activo</h2>\n  <p>Ejecución limpia desde RAM sin alteración de origen.</p>\n</div>`;
            updateRender();
            document.getElementById('center-render').checked = true;
        }

        const popup = document.getElementById('agent-popup');
        const agentTitle = document.getElementById('agent-title');

        function openAgent(name) {
            agentTitle.innerText = name;
            popup.style.display = 'flex';
        }

        function closeAgent() {
            popup.style.display = 'none';
        }

        let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
        const handle = document.getElementById('popup-drag-handle');

        handle.addEventListener("mousedown", dragStart);
        document.addEventListener("mouseup", dragEnd);
        document.addEventListener("mousemove", drag);

        function dragStart(e) {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            if (e.target === handle || handle.contains(e.target)) isDragging = true;
        }

        function dragEnd() { initialX = currentX; initialY = currentY; isDragging = false; }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                popup.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }

        updateRender();
    </script>
