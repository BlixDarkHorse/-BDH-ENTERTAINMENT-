<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAZAR ON READY - OJO DE KILLROG V3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #ff00d4;
            --color-text: #ffffff;
            --glow: rgba(255, 0, 157, 0.6);
            --bg-solid: #000000;
        }
        body { 
            background-color: var(--bg-solid); 
            color: var(--color-text); 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* Contenedor del Reproductor SQR */
        .video-frame { 
            position: relative; 
            width: 95vw; 
            height: 95vh; 
            background: #000; 
            border: 2px solid var(--color-primary); 
            box-shadow: 0 0 30px var(--glow); 
        }
        .blazar-player-wrapper { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        .blazar-player-wrapper video { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            transition: filter 0.1s; 
        }
        
        /* Escudo Anti-Capturas */
        .anti-piracy-shield { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 10; 
        }
        
        /* Interfaz de Estado / Buffer */
        #buffer-status { 
            font-size: 1.5rem; 
            color: var(--color-primary); 
            text-shadow: 0 0 10px var(--glow); 
            font-weight: bold; 
            position: absolute; 
            z-index: 50; 
            text-align: center;
            padding: 20px;
        }

        /* Menú Black Hole */
        .black-hole-menu { 
            position: fixed; 
            background: #050505; 
            border: 1px solid var(--color-primary); 
            box-shadow: 0 0 25px var(--glow); 
            border-radius: 8px; 
            padding: 10px 0; 
            min-width: 200px; 
            z-index: 99999; 
            display: none; 
            flex-direction: column; 
            transform: scale(0.9); 
            opacity: 0; 
            transition: transform 0.2s, opacity 0.2s; 
        }
        .black-hole-menu.active { display: flex; transform: scale(1); opacity: 1; }
        .bh-title { color: var(--color-primary); text-align: center; font-size: 1rem; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 5px; font-weight: bold; }
        .bh-item { color: var(--color-text); padding: 10px 20px; cursor: pointer; font-size: 1rem; transition: background 0.2s; display: flex; justify-content: space-between; font-weight: bold; }
        .bh-item:hover { background: var(--color-primary); color: #000; }
        
        .v-feedback { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #000; -webkit-text-stroke: 1px var(--color-primary); font-size: 3rem; font-weight: bold; z-index: 100; pointer-events: none; text-shadow: 0 0 20px var(--glow); }
    </style>
</head>
<body>

    <div id="buffer-status">Inicializando núcleo Blazar...</div>
    
    <div class="video-frame" id="contenedor-reproductor" style="display: none;">
        <div class="blazar-player-wrapper" id="reproductor-blazar">
            <div class="anti-piracy-shield" id="shield"></div>
            <video id="main-video" controls autoplay controlsList="nodownload"></video>
        </div>
    </div>

    <!-- Menú Black Hole -->
    <!-- Menú Black Hole y otros elementos visuales previos -->
    <div class="black-hole-menu" id="black-hole">
        <div class="bh-title">🌀 BDH Black Hole</div>
        <div class="bh-item" id="bh-fullscreen"><span>Pantalla Completa</span> <span>⛶</span></div>
        <div class="bh-item" id="bh-pip"><span>Imagen en Imagen</span> <span>📺</span></div>
        <div class="bh-item" id="bh-speed"><span>Velocidad</span> <span id="bh-speed-val">1.0x</span></div>
    </div>

    <!-- PEGA EL CÓDIGO AQUÍ, JUSTO ANTES DE CERRAR EL BODY -->
<script>
    window.addEventListener('DOMContentLoaded', async () => {
        const statusText = document.getElementById('buffer-status');
        const contenedor = document.getElementById('contenedor-reproductor');
        const urlParams = new URLSearchParams(window.location.search);
        const targetSrc = urlParams.get('src');

        if (!targetSrc) {
            statusText.innerText = "Error fáctico: Falta el parámetro src.";
            return;
        }

        statusText.innerText = "Leyendo coordenadas en soprano.jsonl...";

        try {
            const response = await fetch('soprano.jsonl');
            if (!response.ok) throw new Error("No se pudo leer el archivo soprano.jsonl");

            const text = await response.text();
            let videoUrl = null;
            const decodedTarget = decodeURIComponent(targetSrc);

            for (const line of text.split('\n')) {
                if (line.trim()) {
                    const meta = JSON.parse(line.trim());
                    // Busca coincidencia por nombre, id o contenido de la línea
                    if (meta.name === decodedTarget || line.includes(decodedTarget) || meta.id === decodedTarget) {
                        videoUrl = meta.downloadUrl || meta['@microsoft.graph.downloadUrl'] || meta.url;
                        break;
                    }
                }
            }

            if (!videoUrl) {
                if (decodedTarget.startsWith('http://') || decodedTarget.startsWith('https://')) {
                    videoUrl = decodedTarget;
                } else {
                    throw new Error(`El archivo "${decodedTarget}" no tiene un enlace de descarga en soprano.jsonl`);
                }
            }

            statusText.style.display = 'none';
            contenedor.style.display = 'block';

            if (typeof BlazarPlayer === 'function') {
                new BlazarPlayer('#reproductor-blazar', videoUrl, decodedTarget);
            } else {
                const videoEl = document.getElementById('main-video');
                videoEl.src = videoUrl;
                videoEl.play();
            }

        } catch (error) {
            statusText.style.display = 'block';
            contenedor.style.display = 'none';
            statusText.innerText = "Falla de Sistema: " + error.message;
            console.error(error);
        }
    });
</script>
</body>
</html>
