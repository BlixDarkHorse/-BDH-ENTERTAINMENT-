<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDH Entertainment - Ojo de Killrog</title>
    <link rel="stylesheet" href="../🌹.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="../blazar-player.js"></script>
</head>

<body>
    <div id="buffer-status" style="color: #ff00d4; font-family: 'OLD ENGLISH TEXT', serif; font-size: 1.5rem; text-align: center; padding-top: 20vh; font-weight: bold;">
        ⚡ Cargando Ojo de Killrog...
    </div>

    <div class="main-container">
        <h1 class="title">BDH ENTERTAINMENT</h1>
        <div class="video-frame">
            <div id="reproductor-blazar"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const statusDiv = document.getElementById('buffer-status');
            const urlParams = new URLSearchParams(window.location.search);
            const rawSrc = urlParams.get('src');

            if (!rawSrc) {
                if (statusDiv) statusDiv.innerHTML = '<span style="color:#ff0000;">⚠️ Error: No se recibió la variable ?src=</span>';
                return;
            }

            const decodedSrc = decodeURIComponent(rawSrc);
            let finalUrl = null;

            // 1. Si es una URL directa (http:// o https:// de Azure Blob Storage)
            if (decodedSrc.startsWith('http://') || decodedSrc.startsWith('https://')) {
                finalUrl = decodedSrc;
            } 
            // 2. Si es un nombre de archivo (ej. "Los.Soprano.1x01.HD720p-lat.mkv"), busca en soprano.jsonl
            else {
                try {
                    let response = await fetch('../bases_de_datos/soprano.jsonl').catch(() => null);
                    if (!response || !response.ok) {
                        response = await fetch('../soprano.jsonl').catch(() => null);
                    }
                    if (!response || !response.ok) {
                        response = await fetch('bases_de_datos/soprano.jsonl').catch(() => null);
                    }

                    if (response && response.ok) {
                        const textData = await response.text();
                        for (const line of textData.split('\n')) {
                            if (line.trim() && line.includes(decodedSrc)) {
                                const meta = JSON.parse(line.trim());
                                if (meta.id) {
                                    // Convierte el ID de OneDrive en la URL directa de descarga de Microsoft
                                    const cid = meta.id.split('!');
                                    finalUrl = `https://onedrive.live.com/download?cid=${cid}&resid=${encodeURIComponent(meta.id)}`;
                                } else if (meta.url) {
                                    finalUrl = meta.url;
                                }
                                break;
                            }
                        }
                    }
                } catch (err) {
                    console.error("Error al leer la base de datos JSONL:", err);
                }
            }

            if (!finalUrl) {
                if (statusDiv) statusDiv.innerHTML = `<span style="color:#ff0000;">❌ No se encontró el archivo "${decodedSrc}" en soprano.jsonl</span>`;
                return;
            }

            // Ocultar pantalla de carga
            if (statusDiv) statusDiv.style.display = 'none';

            try {
                // Instanciar BlazarPlayer con la URL resuelta
                window.player = new BlazarPlayer('#reproductor-blazar', finalUrl);
            } catch (err) {
                if (statusDiv) statusDiv.innerHTML = `<span style="color:#ff0000;">⚠️ Error al iniciar reproductor: ${err.message}</span>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
