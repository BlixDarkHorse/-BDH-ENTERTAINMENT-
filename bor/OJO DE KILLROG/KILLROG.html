<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAZAR ON READY - OJO DE KILLROG V3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #ff00d4;
            --color-text: #ffffff;
            --glow: rgba(255, 0, 157, 0.6);
            --bg-solid: #000000;
        }
        body { 
            background-color: var(--bg-solid); 
            color: var(--color-text); 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* Contenedor del Reproductor SQR */
        .video-frame { 
            position: relative; 
            width: 95vw; 
            height: 95vh; 
            background: #000; 
            border: 2px solid var(--color-primary); 
            box-shadow: 0 0 30px var(--glow); 
        }
        .blazar-player-wrapper { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        .blazar-player-wrapper video { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            transition: filter 0.1s; 
        }
        
        /* Escudo Anti-Capturas */
        .anti-piracy-shield { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 10; 
        }
        
        /* Interfaz de Estado / Buffer */
        #buffer-status { 
            font-size: 1.5rem; 
            color: var(--color-primary); 
            text-shadow: 0 0 10px var(--glow); 
            font-weight: bold; 
            position: absolute; 
            z-index: 50; 
            text-align: center;
            padding: 20px;
        }

        /* Menú Black Hole */
        .black-hole-menu { 
            position: fixed; 
            background: #050505; 
            border: 1px solid var(--color-primary); 
            box-shadow: 0 0 25px var(--glow); 
            border-radius: 8px; 
            padding: 10px 0; 
            min-width: 200px; 
            z-index: 99999; 
            display: none; 
            flex-direction: column; 
            transform: scale(0.9); 
            opacity: 0; 
            transition: transform 0.2s, opacity 0.2s; 
        }
        .black-hole-menu.active { display: flex; transform: scale(1); opacity: 1; }
        .bh-title { color: var(--color-primary); text-align: center; font-size: 1rem; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 5px; font-weight: bold; }
        .bh-item { color: var(--color-text); padding: 10px 20px; cursor: pointer; font-size: 1rem; transition: background 0.2s; display: flex; justify-content: space-between; font-weight: bold; }
        .bh-item:hover { background: var(--color-primary); color: #000; }
        
        .v-feedback { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #000; -webkit-text-stroke: 1px var(--color-primary); font-size: 3rem; font-weight: bold; z-index: 100; pointer-events: none; text-shadow: 0 0 20px var(--glow); }
    </style>
</head>
<body>

    <div id="buffer-status">Inicializando núcleo Blazar...</div>
    
    <div class="video-frame" id="contenedor-reproductor" style="display: none;">
        <div class="blazar-player-wrapper" id="reproductor-blazar">
            <div class="anti-piracy-shield" id="shield"></div>
            <video id="main-video" controls autoplay controlsList="nodownload"></video>
        </div>
    </div>

    <!-- Menú Black Hole -->
    <div class="black-hole-menu" id="black-hole">
        <div class="bh-title">🌀 BDH Black Hole</div>
        <div class="bh-item" id="bh-fullscreen"><span>Pantalla Completa</span> <span>⛶</span></div>
        <div class="bh-item" id="bh-pip"><span>Imagen en Imagen</span> <span>📺</span></div>
        <div class="bh-item" id="bh-speed"><span>Velocidad</span> <span id="bh-speed-val">1.0x</span></div>
    </div>

<script>
    /**
     * =========================================================================
     * KEPPLER ENGINE & BLAZAR PLAYER CORE
     * =========================================================================
     */
    class BlazarPlayer {
        constructor(containerSelector, sourceUrl, title = "Reproducción Blazar") {
            this.container = document.querySelector(containerSelector);
            this.video = this.container.querySelector('video');
            this.sourceUrl = sourceUrl;
            this.title = title;
            this.init();
        }

        init() {
            if (!this.video) return;
            this.video.src = this.sourceUrl;
            this.video.load();
            this.video.play().catch(err => {
                console.warn("Autoplay restringido por el navegador, esperando interacción:", err);
            });
        }
    }

    /**
     * =========================================================================
     * CONTROLADOR DE ARRANQUE Y ENRUTAMIENTO ONDRIVE / SOPRANO.JSONL
     * =========================================================================
     */
    window.addEventListener('DOMContentLoaded', async () => {
        const statusText = document.getElementById('buffer-status');
        const contenedor = document.getElementById('contenedor-reproductor');
        
        const urlParams = new URLSearchParams(window.location.search);
        const targetSrc = urlParams.get('src');

        if (!targetSrc) {
            statusText.innerText = "Error fáctico: No se recibió parámetro de video en la ruta.";
            return;
        }

        statusText.innerText = "Analizando coordenadas de origen...";

        let finalStreamUrl = null;

        // Caso A: Si el parámetro es una URL directa http/https
        if (targetSrc.startsWith('http://') || targetSrc.startsWith('https://')) {
            finalStreamUrl = decodeURIComponent(targetSrc);
        } 
        // Caso B: Si el parámetro es el nombre de archivo, consultamos soprano.jsonl y OneDrive Graph
        else {
            try {
                statusText.innerText = "Leyendo base de datos soprano.jsonl...";
                const response = await fetch('soprano.jsonl');
                if (!response.ok) throw new Error("No se pudo localizar el archivo soprano.jsonl");

                const text = await response.text();
                let fileId = null;
                
                for (const line of text.split('\n')) {
                    if (line.trim() && line.includes(targetSrc)) {
                        const meta = JSON.parse(line.trim());
                        fileId = meta.id;
                        break;
                    }
                }

                if (!fileId) throw new Error(`El archivo "${targetSrc}" no está indexado en soprano.jsonl`);

                statusText.innerText = "Obteniendo token de acceso activo...";
                const azureToken = localStorage.getItem('azure_access_token');
                if (!azureToken) throw new Error("Falta el token 'azure_access_token' en el almacenamiento local del navegador.");

                statusText.innerText = "Consultando Microsoft Graph para el stream...";
                const graphRes = await fetch(`https://graph.microsoft.com/v1.0/me/drive/items/${fileId}`, {
                    headers: { 'Authorization': `Bearer ${azureToken}` }
                });

                if (!graphRes.ok) throw new Error("Fallo de autenticación o expiración en la API de Microsoft Graph.");
                
                const data = await graphRes.json();
                finalStreamUrl = data["@microsoft.graph.downloadUrl"];

                if (!finalStreamUrl) throw new Error("La respuesta de Graph no devolvió un enlace de descarga directa.");

            } catch (error) {
                statusText.innerText = "Falla de Sistema: " + error.message;
                console.error("Error crítico en motor Blazar:", error);
                return;
            }
        }

        if (finalStreamUrl) {
            statusText.style.display = 'none';
            contenedor.style.display = 'block';
            
            // Instanciar el motor Blazar Player con la URL resuelta
            window.activeBlazarPlayer = new BlazarPlayer('#reproductor-blazar', finalStreamUrl, targetSrc);
        } else {
            statusText.innerText = "Error fáctico: No se pudo consolidar el flujo de video.";
        }
    });

    /**
     * =========================================================================
     * GESTIÓN DE INTERACCIÓN Y MENÚ BLACK HOLE
     * =========================================================================
     */
    const blackHoleMenu = document.getElementById('black-hole');
    window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        blackHoleMenu.style.top = `${e.clientY}px`;
        blackHoleMenu.style.left = `${e.clientX}px`;
        blackHoleMenu.classList.add('active');
    });

    window.addEventListener('click', () => {
        blackHoleMenu.classList.remove('active');
    });

    document.getElementById('bh-fullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    });
</script>
</body>
</html>
