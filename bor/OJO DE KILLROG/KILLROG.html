<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDH Entertainment - Reproductor Ojo de Killrog V3</title>
    
    <!-- Fuentes e Iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Inputs Maestros para Temas (Rosa / Dorado) y Vistas (Estándar / Cine / Mini) -->
    <input type="radio" id="theme-pink" name="theme-switch" checked style="display:none;">
    <input type="radio" id="theme-gold" name="theme-switch" style="display:none;">
    <input type="radio" id="view-normal" name="slide" checked style="display:none;">
    <input type="radio" id="view-cinema" name="slide" style="display:none;">
    <input type="radio" id="view-mini" name="slide" style="display:none;">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* TEMA ROSA ELÉCTRICO */
        #theme-pink:checked ~ .sqr-wrapper {
            --color-primary: #ff00d4;
            --color-secondary: #ff0095;
            --color-text: #ffffff;
            --color-muted: #795974;
            --bg-solid: #000000;
            --glow: rgba(255, 0, 157, 0.6);
            --gradient-frame: radial-gradient(circle, #ff00d4 0%, #ff0095 30%, #000 100%);
            --border-subtle: rgba(250, 0, 167, 0.459);
        }

        /* TEMA DORADO */
        #theme-gold:checked ~ .sqr-wrapper {
            --color-primary: #D4AF37;
            --color-secondary: #7c6107;
            --color-text: #ffffff;
            --color-muted: #a39158;
            --bg-solid: #000000;
            --glow: rgba(212, 175, 55, 0.6);
            --gradient-frame: radial-gradient(circle, #D4AF37 0%, #7c6107 30%, #000 100%);
            --border-subtle: rgba(212, 175, 55, 0.459);
        }

        .sqr-wrapper {
            font-family: 'Segoe UI', serif;
            background-color: var(--bg-solid);
            color: var(--color-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR SQR */
        .navbar { position: sticky; top: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.95); border-bottom: 1px solid var(--border-subtle); z-index: 10000; padding: 1rem 0; }
        .navbar-content { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; padding: 0 1rem; }
        .nav-tools { display: flex; gap: 15px; align-items: center; }
        .brand-link { color: var(--color-primary); text-decoration: none; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 10px var(--glow); letter-spacing: 2px; }
        .theme-selector { display: flex; gap: 10px; border-right: 1px solid var(--border-subtle); border-left: 1px solid var(--border-subtle); padding: 0 15px; }
        .theme-btn { cursor: pointer; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--color-primary); background: #111; color: #fff; font-weight: bold; }
        #theme-pink:checked ~ .sqr-wrapper label[for="theme-pink"], 
        #theme-gold:checked ~ .sqr-wrapper label[for="theme-gold"] { background: var(--color-primary); color: #000; box-shadow: 0 0 10px var(--glow); }
        .view-btn { color: var(--color-primary); cursor: pointer; font-weight: bold; padding: 0.5rem; text-transform: uppercase; }

        /* MARCO DEL REPRODUCTOR */
        .main-container { display: flex; flex-direction: column; align-items: center; width: 100%; position: relative; z-index: 9; padding-top: 20px; }
        .title { font-size: 2.5rem; color: var(--color-primary); text-align: center; margin-bottom: 20px; text-shadow: 0 0 15px var(--glow); text-transform: uppercase; }
        .video-frame { position: relative; width: 85%; max-width: 1100px; padding: 5px; background: var(--gradient-frame); border-radius: 10px; box-shadow: 0 0 30px var(--glow); margin: 0 auto; transition: all 0.4s ease; z-index: 10; }

        /* MODO CINE Y MINI */
        .cinema-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.98); z-index: 9000; }
        #view-cinema:checked ~ .sqr-wrapper .cinema-overlay { display: block; }
        #view-cinema:checked ~ .sqr-wrapper .video-frame { width: 95vw; max-width: none; margin-top: 2vh; z-index: 9001; }
        #view-cinema:checked ~ .sqr-wrapper .title { display: none; }
        #view-mini:checked ~ .sqr-wrapper .video-frame { position: fixed; right: 20px; bottom: 20px; width: 400px; z-index: 3000; }

        /* ESTADO DE CARGA */
        #buffer-status { text-align: center; color: var(--color-primary); font-size: 1.2rem; font-weight: bold; padding: 40px; text-shadow: 0 0 10px var(--glow); }
    </style>
</head>
<body>

<div class="sqr-wrapper">
    <div class="cinema-overlay"></div>

    <!-- NAVBAR NAVEGACIÓN -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="../INDEX.html" class="brand-link">
                <i class="fas fa-arrow-left"></i> BLAZAR ON READY
            </a>

            <div class="theme-selector">
                <label for="theme-pink" class="theme-btn">🐉 Rosa</label>
                <label for="theme-gold" class="theme-btn">🐎 Dorado</label>
            </div>
            
            <div class="nav-tools">
                <label for="view-normal" class="view-btn">Estándar</label>
                <label for="view-cinema" class="view-btn">Cine</label>
                <label for="view-mini" class="view-btn">Mini</label>
            </div>
        </div>
    </nav>
    
    <!-- CONTENEDOR PRINCIPAL DEL REPRODUCTOR -->
    <div class="main-container">
        <h1 class="title" id="player-title">REPRODUCTOR KEPPLER V2</h1>
        
        <div class="video-frame">
            <div id="buffer-status">
                <i class="fas fa-spinner fa-spin"></i> Inicializando Motor de Video...
            </div>
            <div id="reproductor-blazar"></div>
        </div>
    </div>
</div>

<!-- LIBRERÍAS DE REPRODUCCIÓN -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="blazar-player.js"></script>

<!-- MOTOR DE ENRUTAMIENTO BIFURCADO -->
<script>
document.addEventListener('DOMContentLoaded', async () =&gt; { const statusDiv = document.getElementById('buffer-status');
    const titleHeader = document.getElementById('player-title');
    
    // 1. Obtener el capítulo desde la URL (?src=)
    const urlParams = new URLSearchParams(window.location.search);
    const targetSrc = urlParams.get('src');

    if (!targetSrc) {
        if (statusDiv) statusDiv.innerHTML = '<span>⚠️ Error: No se especificó ningún capítulo</span>';
        return;
    }

    const decodedSrc = decodeURIComponent(targetSrc);
    let finalVideoUrl = null;

    // CASO A: Si es una URL completa (ej. Azure Blob)
    if (decodedSrc.startsWith('http://') || decodedSrc.startsWith('https://')) {
        finalVideoUrl = decodedSrc;
        if (statusDiv) statusDiv.style.display = 'none';
        new BlazarPlayer('#reproductor-blazar', finalVideoUrl);
        return;
    }

    // CASO B: Si es un nombre corto (.mkv), lee soprano.jsonl y arma la URL automáticamente
    try {
        const response = await fetch('bases_de_datos/soprano.jsonl');
        if (!response.ok) throw new Error("No se pudo cargar soprano.jsonl");

        const textData = await response.text();
        const lines = textData.split('\n');

        for (let line of lines) {
            if (line.trim() &amp;&amp; line.includes(decodedSrc)) {
                const meta = JSON.parse(line.trim());
                
                // Si tiene id de OneDrive, construye el enlace directo de descarga al instante
                if (meta.id) {
                    const cid = meta.id.split('!')[0];
                    finalVideoUrl = `https://onedrive.live.com/download?cid=${cid}&amp;resid=${encodeURIComponent(meta.id)}`;
                } else if (meta.url) {
                    finalVideoUrl = meta.url;
                }

                if (meta.name &amp;&amp; titleHeader) {
                    titleHeader.innerText = meta.name;
                }
                break;
            }
        }

        if (finalVideoUrl) {
            if (statusDiv) statusDiv.style.display = 'none';
            // Inicia la reproducción en BlazarPlayer
            new BlazarPlayer('#reproductor-blazar', finalVideoUrl);
        } else {
            if (statusDiv) statusDiv.innerHTML = `<span>❌ El capítulo "${decodedSrc}" no existe en soprano.jsonl</span>`;
        }

    } catch (err) {
        if (statusDiv) statusDiv.innerHTML = `<span>⚠️ Error: ${err.message}</span>`;
        console.error(err);
    }
});
</script>

</body>
</html>
