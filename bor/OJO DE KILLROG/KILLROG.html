    async function obtenerTokenFresco() {
        const url = "https://login.microsoftonline.com/common/oauth2/v2.0/token";
        const params = new URLSearchParams();
        params.append("client_id", CLIENT_ID);
        params.append("grant_type", "refresh_token");

            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params
        });

        if (!response.ok) throw new Error("Refresh Token muerto o inválido.");
        const data = await response.json();
        return data.access_token;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const targetFileName = urlParams.get('src');

        if (!targetFileName) {
            statusText.innerText = "Error fáctico: No se recibió parámetro de video.";
            return;
        }

        statusText.innerText = "Escaneando bases de datos de OneDrive...";
        let videoMetadata = null;

        for (const dbPath of DATABASES) {
            try {
                const response = await fetch(dbPath);
                if (response.ok) {
                    const text = await response.text();
                    const lines = text.split('\n');
                    for (const line of lines) {
                        if (line.trim() && line.includes(targetFileName)) {
                            videoMetadata = JSON.parse(line.trim());
                            break;
                        }
                    }
                }
            } catch (e) {
                console.warn(`No se pudo leer la ruta: ${dbPath}`);
            }
            if (videoMetadata) break;
        }

        if (!videoMetadata) {
            statusText.innerText = "Archivo no indexado en las bases de datos.";
            return;

        statusText.innerText = "Autenticando con token fresco...";
        
        try {
            const tokenVivo = await obtenerTokenFresco();
            
            const streamResponse = await fetch(`https://graph.microsoft.com/v1.0/me/drive/items/${videoMetadata.id}`, {
                headers: { 'Authorization': `Bearer ${tokenVivo}` }
            });
            
            if (!streamResponse.ok) throw new Error("Fallo al contactar el clúster de OneDrive.");
            
            const data = await streamResponse.json();
            const downloadUrl = data["@microsoft.graph.downloadUrl"];

                statusText.style.display = 'none';
                contenedor.style.display = 'block';
                videoElement.src = downloadUrl;
                videoElement.play();
            } else {
                throw new Error("No se obtuvo la URL de descarga directa.");
            }
        } catch (error) {
            statusText.innerText = "Falla de Sistema: " + error.message;
            console.error(error);
        }
